services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budget_buddy
      POSTGRES_USER: budget_buddy
      POSTGRES_PASSWORD: budget_buddy
    ports:
      - "5433:5432"
    volumes:
      - budget_buddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_buddy -d budget_buddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      API_BASE_PATH: /v1
      DATABASE_URL: postgres://budget_buddy:budget_buddy@db:5432/budget_buddy?sslmode=disable
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006
      JWT_ACCESS_SECRET: development_only_budget_buddy_access_secret_change_me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      LOG_LEVEL: debug
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_CLIENT_NAME: ${PLAID_CLIENT_NAME:-Budget Buddy}
      PLAID_PRODUCTS: ${PLAID_PRODUCTS:-transactions}
      PLAID_OPTIONAL_PRODUCTS: ${PLAID_OPTIONAL_PRODUCTS:-}
      PLAID_COUNTRY_CODES: ${PLAID_COUNTRY_CODES:-US}
      PLAID_ANDROID_PACKAGE_NAME: ${PLAID_ANDROID_PACKAGE_NAME:-}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_TOKEN_ENCRYPTION_KEY: ${PLAID_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://budget_buddy:budget_buddy@db:5432/budget_buddy?sslmode=disable",
        "up"
      ]
    depends_on:
      db:
        condition: service_healthy

volumes:
  budget_buddy_pgdata:
