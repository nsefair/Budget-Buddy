# Single-host pilot. Keep runtime.env on the server, outside Git and image layers.
name: budget-buddy-pilot

x-logs: &logs
  driver: local
  options:
    max-size: "5m"
    max-file: "2"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budget_buddy
      POSTGRES_USER: budget_buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    volumes:
      - database:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_buddy -d budget_buddy"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: [tools]
    volumes:
      - ./backend/migrations:/migrations:ro
    networks: [private]
    command: ["-path=/migrations", "-database=postgres://budget_buddy:${POSTGRES_PASSWORD:?Set database password}@db:5432/budget_buddy?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 64m
    logging: *logs

  api:
    image: ${API_IMAGE:?Set the tested ECR image digest}
    restart: unless-stopped
    env_file: ${RUNTIME_ENV_FILE:-./runtime.env}
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      API_BASE_PATH: /v1
      DATABASE_URL: postgres://budget_buddy:${POSTGRES_PASSWORD:?Set database password}@db:5432/budget_buddy?sslmode=disable
      RATE_LIMIT_PER_MINUTE: "120"
      GLOBAL_RATE_LIMIT_PER_MINUTE: "600"
      MAX_CONCURRENT_REQUESTS: "8"
      TRUSTED_PROXY_CIDRS: 172.30.0.2/32
      READ_TIMEOUT: 5s
      WRITE_TIMEOUT: 20s
      IDLE_TIMEOUT: 30s
      LOG_LEVEL: warn
      GOMEMLIMIT: 128MiB
      GOMAXPROCS: "2"
      BUDS_MEDIA_DIR: /var/lib/budget-buddy/media
    volumes:
      - media:/var/lib/budget-buddy/media
    networks:
      private:
      proxy:
        ipv4_address: 172.30.0.3
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.75
    pids_limit: 64
    stop_grace_period: 15s
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?Set the approved DNS hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *logs
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  private:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  database:
  media:
  certificates:
  caddy_config:
